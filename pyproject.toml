[project]
name = 'hydramind'
version = '0.1.0'
description = 'Graph-native memory for MCP'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = [
  'mcp>=1.0.0',
  'fastapi>=0.110.0',
  'uvicorn>=0.29.0',
  'pydantic>=2.0',
  'httpx>=0.27.0',
]

[project.optional-dependencies]
dev = ['pytest>=8.0', 'pytest-asyncio>=0.23']

[project.scripts]
hydramind = 'hydramind.cli:server_main'
hydramind-http = 'hydramind.cli:http_main'
hydramind-ui = 'hydramind.cli:ui_main'
hydramind-export = 'hydramind.exporter:main'
hydramind-import = 'hydramind.importer:main'

[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/hydramind']

[tool.pytest.ini_options]
testpaths = ['tests']
