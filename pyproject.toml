[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hydramind"
version = "0.3.0"
description = "An MCP server providing persistent, trust-weighted memory backed by HydraDB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "HydraMind contributors" }]
keywords = ["mcp", "model-context-protocol", "agent-memory", "hydradb", "graph", "llm", "coding-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "mcp>=2,<3",
  "neo4j>=5.28,<7",
]

[project.urls]
Homepage = "https://github.com/himanshu748/hydramind"
Repository = "https://github.com/himanshu748/hydramind"
Issues = "https://github.com/himanshu748/hydramind/issues"
Changelog = "https://github.com/himanshu748/hydramind/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<3",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
hydramind = "hydramind.server:main"
hydramind-http = "hydramind.server:http_main"
hydramind-ui = "hydramind.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hydramind"]

[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "hydramind/ui"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.coverage",
  "/.mypy_cache",
  "/.playwright-cli",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/dist",
  "/output",
  "/outputs",
  "/tmp",
  "/ui/node_modules",
  "/videos",
  "/work",
]

[tool.hatch.build.targets.sdist.force-include]
"ui/dist" = "ui/dist"

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: requires a live HydraDB Bolt endpoint",
]

[tool.coverage.run]
source = ["hydramind"]
omit = [
  "src/hydramind/__main__.py",
  "src/hydramind/web.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
