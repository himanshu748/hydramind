name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Rebuild the packaged UI
        working-directory: ui
        run: npm ci && npm run build
      - name: Verify the packaged UI matches its source
        run: git diff --exit-code -- ui/dist
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run ruff check src tests examples
      - name: Check formatting
        run: uv run ruff format --check src tests examples
      - name: Type-check
        run: uv run mypy src
      - name: Run database-independent tests
        run: uv run pytest -m 'not integration'
      - name: Build installable artifacts
        run: uv build
